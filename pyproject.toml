[project]
name = "valheim-dedicated-server-docker-helm"
version = "2.0.1"
description = ""
authors = [
    {name = "Max Pfeiffer",email = "max@maxpfeiffer.ch"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.12,<4"
dependencies = [
    "click==8.4.1",
    "python-on-whales==0.81.0",
    "steam[client]>=1.4.4,<2.0.0",
]

[dependency-groups]
dev = [
    "bcrypt==5.0.0",
    "furl==2.1.4",
    "pre-commit==4.6.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "testcontainers==4.14.2",
]

# This project is build tooling, not a distributable package: nothing here is ever
# installed into the image, so uv only manages the environment its scripts run in.
[tool.uv]
package = false

[tool.ruff]
src = ["build", "tests"]
extend-exclude = ["charts", "examples"]

[tool.ruff.lint]
select = [
    "F", # Pyflakes
    "E", # pycodestyle
    "W", # pycodestyle
    "I", # isort
    "D",   # pydocstyle
    "UP",  # pyupgrade
    "ASYNC", # flake8-async
    "RUF",  # Ruff-specific rules
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

# https://docs.pytest.org/en/latest/reference/customize.html
[tool.pytest.ini_options]
testpaths = [
    "tests",
]
